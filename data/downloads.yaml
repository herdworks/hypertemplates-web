releases:
  - version: 0.23.0
    date: "2026-08-04T16:00:00-07:00"
    description: |
      **NEW:** `hyperctl` version 0.23.0 with redesigned templating directives [template variables](/docs/reference/core/variables/), and a `hyperctl theme migrate` command to help with migrating legacy directives.

      * Added [new `ht-each` directive](/docs/reference/core/directives/ht-each/) with [`ht-each='item in ${ variable }'` syntax](/docs/reference/core/directives/ht-each/#directive-syntax). 
      * Added [`hyperctl theme migrate` command](/docs/reference/cli/commands/theme/migrate/) with idempotent migration of legacy directives. 
      * **BREAKING:** changed the [temlpate variable function invocation syntax](/docs/reference/core/variables/#template-variable-functions) to use parenthetical argument lists.
      * **BREAKING:** changed the [CSS template variable syntax](/docs/reference/core/variables/#template-variable-syntax) from `--ht-value(...)` to `--ht-var(...)`.
      * **BREAKING:** changed [`ht-pipe`](/docs/reference/core/directives/ht-pipe/) directive to pull-based `ht-pipe='from "selector"'` expressions.  
        _NOTE: `ht-pipe` directives now deduplicate piped contents!_
      * **BREAKING:** removed the `ht-template` in favor of the [`ht-each`](/docs/reference/core/directives/ht-each/) directive. 
      * **BREAKING:** removed the `ht-not` directive in favor of a [more expressive `ht-if` directive](/docs/reference/core/directives/ht-if/#directive-syntax).
      * **BREAKING:** removed the `ht-content` directive in favor of using [`ht-apply`] for content templating.
      * **BREAKING:** removed the `ht-attr` directive in favor of using [`ht-apply`] for attribute templating;  
        _NOTE: `ht-attrs` (plural) is still supported, but only for [attribute maps](/docs/reference/core/directives/ht-attrs/#attribute-maps)._
      * **BREAKING:** removed the `ht-query` directive in favor of using [`ht-apply`] for URL attribute [string interpolation](/docs/reference/core/variables/#string-interpolation).
      * **BREAKING:** removed the `ht-param` directive in favor of using [`ht-apply`] with template variables for [string interpolation](/docs/reference/core/variables/#string-interpolation).

      Please visit the [CHANGELOG](/changelog/) for a complete list of improvements. 

      [ht-apply]: /docs/reference/core/directives/ht-apply/
