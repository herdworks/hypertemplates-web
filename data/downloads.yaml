  - version: 0.18.0
    date: "2026-02-26T10:00:00-08:00"
    description: |
      **NEW:** version 0.18.0 is a significant new release that includes a number of new features, including: 

      * [NEW `ht-limit` and `ht-offset` attributes](/docs/reference/core/attributes/ht-template/#limit-and-offset)
      * [NEW `page.canonical_url` and `page.wordcount` computed properties](/docs/reference/cms/page/#properties)
      * Many improvements around [themes](/docs/reference/core/themes/) including a [new `theme.*` template data namespace](/docs/reference/core/data/#template-data-sources), and a [new `hyperctl theme` command](/docs/reference/cli/commands/theme/) for packaging and installing themes. 

      To see a complete list of changes, including the first breaking changes to `hyperctl`, please see the [CHANGELOG](/changelog/).
