<video-player src poster caption orientation>
    <style class='component'>
        video-player {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: var(--gutter-3x);
            margin-bottom: var(--gutter-3x);
        }
        video-player video {
            width: 65%;
            object-fit: contain;
            margin-left: auto;
            margin-right: auto;
        }
        video-player[orientation='vertical'] {
            aspect-ratio: 16 / 9;
        }
        video-player[orientation='vertical'] video {
            width: 100%;
            height: 100%;
        }
        video-player figcaption {
            margin-bottom: var(--gutter-200, 30px);
        }
        video-player figcaption p {
            font-size: 0.9rem;
            width: var(--figure-default-width);
            margin-left: auto;
            margin-right: auto;
        }
        video-player figcaption p a {
            font-size: inherit;
            color: inherit;
        }
        video-player video-controls button {
            display: none;
        }

        @media screen and (min-width: 1280px) {}
        @media screen and (min-width: 768px) and (max-width: 1279px) { 
            video-player video { width: 80%; }
        }
        @media screen and (max-width: 767px) {
            video-player video { width: 90%; }
            video-player[orientation='vertical'] { aspect-ratio: 9 / 16; }
        }
    </style>
    <video ht-apply controls preload='none' poster='${ block.poster }'>
        <source ht-apply src='${ block.src, block.video, "#" }' type="video/mp4">
    </video>
    <figcaption ht-apply ht-if='${ block.caption }'>${ markdown(block.caption) }</figcaption>
</video-player>
