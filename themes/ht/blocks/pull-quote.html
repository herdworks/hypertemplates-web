<pull-quote cite href>
    <!-- https://css-irl.info/ive-been-doing-blockquotes-wrong/ -->
    <style ht-pipe='css:style#components'>
        pull-quote blockquote {
            background-color: inherit;
            font-weight: 500;
            border-left: none;
            border-right: var(--gutter-width) solid color-mix(in srgb, var(--accent-shade) 50%, transparent);
            text-align: right;
            padding-left: 30%;
        }
        pull-quote blockquote > span {
            display: block;
            font-style: italic;
        }
        pull-quote blockquote cite:not(:empty)::before {
            content: "— "
        }
        pull-quote blockquote cite {
            display: block;
            font-weight: bold;
            padding-top: var(--gutter-1x, 15px);
        }
    </style>
    <blockquote>
        <span ht-apply>${ block.content }</span>
        <cite ht-if='block.cite'>
            <span ht-not='block.href' ht-apply>${ block.cite }</span>
            <a ht-if='block.href' ht-apply href='${ block.href }'>${ block.cite }</a>
        </cite>
    </blockquote>
</pull-quote>
