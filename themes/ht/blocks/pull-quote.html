<pull-quote cite href>
    <!-- https://css-irl.info/ive-been-doing-blockquotes-wrong/ -->
    <style class='component'>
        pull-quote blockquote {
            background-color: inherit;
            font-weight: 500;
            border-left: none;
            border-right: var(--gutter-width) solid color-mix(in srgb, var(--accent-shade) 50%, transparent);
            text-align: right;
            padding-left: 30%;
        }
        pull-quote blockquote > span {
            display: block;
            font-style: italic;
        }
        pull-quote blockquote cite:not(:empty)::before {
            content: "— "
        }
        pull-quote blockquote cite {
            display: block;
            font-weight: bold;
            padding-top: var(--gutter-1x, 15px);
        }
    </style>
    <blockquote>
        <span ht-apply>${ block.content }</span>
        <cite ht-if='${ block.cite }'>
            <!-- display cite as <span> if block.href is not set -->
            <span ht-apply ht-if='!${ block.href }'>${ block.cite }</span>
            <!-- display cite as <a> if block.href is set  -->
            <a ht-apply ht-if='${ block.href }' href='${ block.href }'>${ block.cite }</a>
        </cite>
    </blockquote>
</pull-quote>
