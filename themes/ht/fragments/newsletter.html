<section id='newsletter' data-color-scheme='gray'>
    <style class='component'>
        #newsletter {
            padding: 50px 0;
        }
        #newsletter content-row {
            grid-template-columns: 1fr 1fr;
            gap: var(--gutter-2x, 30px);
        }
        #newsletter content-column:last-child {
            width: 100%;
            align-self: center;
        }
        @media screen and (max-width: 1279px) {
            #newsletter content-row {
                grid-template-columns: 1fr;
                grid-auto-flow: row;
            }
        }
    </style>
    <content-container>
        <content-row grid>
            <content-column>
                <h3 ht-apply>${ page.newsletter.title,layout.newsletter_title,data.newsletter.title, "The Newsletter" }</h3>
                <p ht-apply>${ page.newsletter.description,layout.newsletter_description,data.newsletter.description, "Subscribe to the newsletter and never miss a post." }</p>
            </content-column>
            <content-column>
                <uni-form ht-include='fragments/uni-form' ht-each='form in ${ data.newsletter.form }'></uni-form>
            </content-column>
        </content-row>
    </content-container>
</section>
