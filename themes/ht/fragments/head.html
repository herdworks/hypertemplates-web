<!-- Global Metadata -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*; img-src 'self' https://*; media-src 'self' https://*;">
<meta ht-apply ht-if='${ page.redirect }' http-equiv='refresh' content='0; url=${ page.redirect }'>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes'>
<title ht-apply ht-if='${ page.path } == /'>${ site.title }</title>
<title ht-apply ht-if='${ page.path } != /'>${ site.title } | ${page.title, "✱" }</title>
<meta ht-apply name='description' content='${ page.description, site.description }' />
<meta ht-apply name='author' content='${ page.byline.name, site.byline.name }' />
<meta ht-include='fragments/open-graph'>
<meta ht-include='fragments/twitter-card'>

<!-- Global Styles -->
<link ht-apply rel='stylesheet' href='/css/reset.css?version=${ site.version, build.id }'>
<link ht-apply rel='stylesheet' href='/css/variables.css?version=${ site.version, build.id }'>
<link ht-apply rel='stylesheet' href='/css/colors.css?version=${ site.version, build.id }'>
<link ht-apply rel='stylesheet' href='/css/typography.css?version=${ site.version, build.id }'>
<link ht-apply rel='stylesheet' href='/css/grid.css?version=${ site.version, build.id }'>
<link ht-apply rel='stylesheet' href='/css/styles.css?version=${ site.version, build.id }'>
<link ht-apply rel='stylesheet' href='/css/chroma-base16-snazzy.css?version=${ site.version, build.id }'>

<!-- Global Scripts -->
<script ht-apply src='/js/main.js?version=${ site.version, build.id }' defer></script>
<script src="https://plausible.io/js/script.file-downloads.outbound-links.js" data-domain="hypertemplates.net" defer></script>
<script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
