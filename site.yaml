---
base_url: https://hypertemplates.net
title: HyperTemplates
description: The pure-HTML templating system for the modern web.
version: 100
copyright: "2026"
author: Herd Works, Inc.
byline:
    username: '@hypertemplates.net'
    name: HyperTemplates
    favicon: /img/favicon-512x512.png
    href: /

links:
  - rel: apple-touch-icon
    href: /img/apple-touch-icon.png
    sizes: 180x180
  - rel: icon
    href: /img/apple-touch-icon.png
    sizes: 180x180
  - rel: icon
    href: /img/favicon-128x128.png
    sizes: 128x128
  - rel: icon
    href: /img/favicon-192x192.png
    sizes: 192x192
  - rel: icon
    href: /img/favicon-256x256.png
    sizes: 256x256
  - rel: icon
    href: /img/favicon-512x512.png
    sizes: 512x512
  - rel: me
    href: https://github.com/hypertemplates
  - rel: me
    href: https://mastodon.social/@herdworks
  - rel: following
    href: https://hypertemplates.net/following.opml

metadata:
  - name: creator 
    content: Herd Works Inc
  - name: publisher 
    content: Herd Works Inc
  - name: referrer
    content: origin
  - name: color-scheme
    content: light dark

config:
    tidy_mode: true
    builds_dir: .builds
    theme: themes/ht/theme.json
    tag_layout: tag.html

providers:
  r2:
    kind: s3
    endpoint: https://5a8b6c901ff20ee02892cf121b1ead54.r2.cloudflarestorage.com
    config:
      bucket: hypertemplates-web-prod
      conditional_mode: etag
    exclude:
      paths:
        - '(^|/)\.DS_Store$'
    secrets:
      - name: access_key_id
        key: AWS_ACCESS_KEY_ID
      - name: secret_access_key
        key: AWS_SECRET_ACCESS_KEY
  r2preview:
    kind: s3
    endpoint: https://5a8b6c901ff20ee02892cf121b1ead54.r2.cloudflarestorage.com
    config:
      bucket: hypertemplates-web-preview
      conditional_mode: etag
    exclude:
      paths:
        - '(^|/)\.DS_Store$'
    secrets:
      - name: access_key_id
        key: AWS_ACCESS_KEY_ID
      - name: secret_access_key
        key: AWS_SECRET_ACCESS_KEY
  github:
    kind: git
    endpoint: git@github.com:herdworks/hypertemplates-web.git
    config:
      branch: gh-pages
      publish_dir: .
    exclude:
      paths:
        - '\.tar\.gz$'
    secrets:
      - name: ssh_private_key
        key: GH_PRIVATE_KEY

environments:
  production: [r2]
  staging: [r2preview]
  dev: [github]

sync:
  remote: https://hypertemplates.net
  include:
    paths:
      - site.yaml
      - content/**
      - data/**
      - static/**
      - themes/**
  ignore:
    paths:
      - .builds/**
      - .DS_Store
  max_file_size: 10MB
